[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rent-envy-minimizer"
version = "0.1.0"
description = "A fair rent-splitting algorithm that minimises envy between housemates."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "John Sime" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[project.scripts]
rent-envy = "rent_envy_minimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]